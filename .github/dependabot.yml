# Monthly, grouped dependency update pull requests.
# Security fixes come separately through "Dependabot security updates" in repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types should follow the Node version Vercel runs, so majors are raised by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major compiler and linter upgrades are done by hand, after checking Next.js support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
